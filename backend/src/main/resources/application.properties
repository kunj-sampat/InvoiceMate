# ===================================================================
# InvoiceMate - Core Application Configuration
# ===================================================================

# Database Configuration (Defaults to embedded H2, or overrides via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/invoicemate}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.h2.Driver}}

# JPA & Hibernate (Dialect is automatically resolved by Hibernate from the JDBC URL)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 Console (Active only when running local H2)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Security & Tokens
jwt.secret=${JWT_SECRET:invoiceMateDefaultSecretKeyForDevelopment2026SuperSecure}
jwt.expiration=86400000

# File Uploads (Business Logos & Signatures)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OAuth2 Single Sign-On
linkedin.client-id=${LINKEDIN_CLIENT_ID:77anf5g8oa87ds}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
google.client-id=${GOOGLE_CLIENT_ID:820451064085-6krcpht9fcde3krqirfli8bnffiame8t.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Web Server
server.port=${PORT:8080}
