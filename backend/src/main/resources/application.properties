# ===================================================================
# InvoiceMate - Core Application Configuration
# ===================================================================

# Database Configuration (Defaults to embedded H2, or overrides via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:h2:file:./data/invoicemate;AUTO_SERVER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DB_DRIVER:org.h2.Driver}}

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 Console (Active only when running local H2)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Security & Tokens
jwt.secret=${JWT_SECRET:invoiceMateDefaultSecretKeyForDevelopment2026SuperSecure}
jwt.expiration=86400000

# File Uploads (Business Logos & Signatures)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OAuth2 Single Sign-On
linkedin.client-id=${LINKEDIN_CLIENT_ID:77anf5g8oa87ds}
linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
google.client-id=${GOOGLE_CLIENT_ID:820451064085-6krcpht9fcde3krqirfli8bnffiame8t.apps.googleusercontent.com}
google.client-secret=${GOOGLE_CLIENT_SECRET:}

# Email & SMTP Configuration (Gmail, SendGrid, Brevo, AWS SES, etc.)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:kunjsampat31@gmail.com}
spring.mail.password=${MAIL_PASSWORD:zygwhwadbjtkgtcw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:kunjsampat31@gmail.com}
mail.enabled=${MAIL_ENABLED:true}

# Web Server
