# ===================================================================
# InvoiceMate - PostgreSQL Profile (Production & Cloud Managed DB)
# Activate via: --spring.profiles.active=postgres
# or environment variable: SPRING_PROFILES_ACTIVE=postgres
# ===================================================================

# PostgreSQL Connection Settings
# Supports Supabase, Neon, Render, Railway, AWS RDS, or local PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/invoicemate}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Disable H2 Console in PostgreSQL mode
spring.h2.console.enabled=false
