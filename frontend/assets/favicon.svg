<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;display=swap');
      .fav-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
      }
    </style>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Modern squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Typographic brand mark -->
  <g transform="translate(10, 45)">
    <text class="fav-text" font-size="35" fill="#ffffff" letter-spacing="-1.5">i</text>
    <text class="fav-text" font-size="35" fill="url(#favGreen)" x="12" letter-spacing="-1.5">M</text>
    <circle cx="44" cy="-3" r="3.8" fill="url(#favGreen)"/>
  </g>
</svg>
