<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .brand-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: -0.7px;
      }
      .brand-invoice {
        font-weight: 800;
        fill: #0f172a;
      }
      .brand-mate {
        font-weight: 900;
        fill: #10b981;
      }
      .brand-dot {
        fill: #10b981;
      }
    </style>
    <linearGradient id="mateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <g transform="translate(4, 34)">
    <text class="brand-text" font-size="33">
      <tspan class="brand-invoice">Invoice</tspan>
      <tspan fill="url(#mateGradient)" class="brand-mate">Mate</tspan>
    </text>
    <circle cx="196" cy="-2" r="4.2" fill="url(#mateGradient)"/>
  </g>
</svg>
