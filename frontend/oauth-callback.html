<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - InvoiceMate</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0b0f17;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .auth-card {
            background: rgba(22, 30, 46, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3.5px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10b981;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 8px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin: 0 0 20px;
        }
        .error-box {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 20px;
        }
        .btn-retry {
            display: inline-block;
            background: #059669;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13.5px;
            transition: 0.2s ease;
        }
        .btn-retry:hover {
            background: #047857;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="spinner" id="spinner"></div>
        <h2 id="status-title">Authenticating...</h2>
        <p id="status-msg">Connecting your profile to your InvoiceMate workspace.</p>
        <div class="error-box" id="error-box"></div>
        <a href="login.html" class="btn-retry" id="btn-return" style="display:none;">Return to Login</a>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');
            const errorDesc = params.get('error_description');

            const spinner = document.getElementById('spinner');
            const title = document.getElementById('status-title');
            const msg = document.getElementById('status-msg');
            const errorBox = document.getElementById('error-box');
            const btnReturn = document.getElementById('btn-return');

            if (error) {
                spinner.style.display = 'none';
                title.textContent = 'Authentication Canceled';
                msg.textContent = 'You canceled the sign-in request.';
                errorBox.textContent = errorDesc || 'Authorization was declined.';
                errorBox.style.display = 'block';
                btnReturn.style.display = 'inline-block';
                return;
            }

            if (!code) {
                spinner.style.display = 'none';
                title.textContent = 'Missing Authorization Code';
                msg.textContent = 'No authorization code received from provider.';
                btnReturn.style.display = 'inline-block';
                return;
            }

            try {
                // Post authorization code to backend
                const redirectUri = window.location.origin + window.location.pathname;
                const res = await apiRequest('POST', '/api/auth/linkedin', { 
                    code: code,
                    redirectUri: redirectUri
                });

                if (res && res.token) {
                    localStorage.setItem('token', res.token);
                    localStorage.setItem('userName', res.fullName || res.name || 'User');
                    localStorage.setItem('userEmail', res.email);
                    if (res.businessName) localStorage.setItem('businessName', res.businessName);
                    if (res.logoPath) localStorage.setItem('userLogo', res.logoPath);

                    title.textContent = 'Sign-In Successful!';
                    msg.textContent = 'Redirecting to your workspace...';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    throw new Error('Invalid token response from server.');
                }
            } catch (err) {
                spinner.style.display = 'none';
                title.textContent = 'Authentication Failed';
                msg.textContent = 'Unable to complete login.';
                errorBox.textContent = err.message || 'An unexpected error occurred.';
                errorBox.style.display = 'block';
                btnReturn.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>
